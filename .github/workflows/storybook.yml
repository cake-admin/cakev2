# Verify Storybook and the design-system package on PRs that touch them.
#
# Pages still deploys only from main (deploy.yml). This workflow is the PR
# gate so a broken Storybook build or an unlistable package never merges.
# It does not publish npm — that remains workflow_dispatch on main.yml.

name: Verify Storybook

on:
  pull_request:
    paths:
      - 'src/cakeand/**'
      - '.storybook/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.lib.config.mts'
      - 'scripts/build-package.mjs'
      - '.github/workflows/storybook.yml'

permissions:
  contents: read

concurrency:
  group: storybook-verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
        env:
          STORYBOOK_BASE: /storybook/
          CI: true

      - name: Install declaration toolchain
        run: npm ci
        working-directory: tools/dts

      - name: Build package (dry)
        run: node scripts/build-package.mjs --version 0.0.0-pr.${{ github.event.pull_request.number }}

      - name: Pack dry-run
        working-directory: dist-package
        run: npm pack --dry-run

      - name: Summary
        run: |
          {
            echo "## Storybook + package verified"
            echo
            echo "- \`npm run build-storybook\` succeeded (what Pages nests at /storybook/)"
            echo "- \`build:package\` + \`npm pack --dry-run\` succeeded (what Publish would ship)"
            echo
            echo "Merging updates cake.lenovo.com/storybook/ via **Deploy to GitHub Pages**."
            echo "The npm package is **not** published on merge — run **Publish design system package** to ship a version."
          } >> "$GITHUB_STEP_SUMMARY"
