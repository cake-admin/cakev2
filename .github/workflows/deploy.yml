name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate tokens
        run: npm run validate-tokens

      - name: Run tests
        run: npm run test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      # CRA site + Storybook (postbuild → build-storybook + nest-storybook).
      # Storybook nests at cake.lenovo.com/storybook/. Pass STORYBOOK_BASE only —
      # do NOT set PUBLIC_URL here or the CRA asset paths break under /storybook/.
      - name: Build
        run: npm run build
        env:
          CI: false
          STORYBOOK_BASE: /storybook/

      # Cake& data visualization playground — built at base /datavis/ and
      # nested under the main site so it goes live at cake.lenovo.com/datavis.
      - name: Install datavis playground dependencies
        working-directory: chart-tool-echarts
        run: npm ci

      # Build directly (tsc + vite) rather than `npm run build`, to skip the
      # `prebuild` token-regen step: it reads design-token exports from repo-root
      # "& *" folders that aren't part of the deploy. The committed
      # src/tokens/tokens.json is the source of truth for the build.
      - name: Build datavis playground
        working-directory: chart-tool-echarts
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/vite/bin/vite.js build

      # Nest into build/datavis (+ /dataviz redirect). Root `npm run build`
      # does NOT include this — only this workflow ships /datavis on Pages.
      - name: Add datavis playground to Pages output
        run: node scripts/nest-datavis.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 